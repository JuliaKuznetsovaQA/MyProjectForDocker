apiVersion: apps/v1
kind: Deployment
metadata:
  name: fileshare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fileshare
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: fileshare
    spec:
      initContainers:
        - name: mount-permission-fix
          image: busybox
          command: ["sh", "-c", "chmod 777 /data"]
          volumeMounts:
            - mountPath: /data
              name: data
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
            limits:
              cpu: 100m
              memory: 100Mi
          volumeMounts:
            - mountPath: /etc/nginx/conf.d
              name: config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: fileshare
        - name: data
          persistentVolumeClaim:
            claimName: fileshare
