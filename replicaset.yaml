apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: my-replicaset-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project1
  template:
    metadata:
      labels:
        app: project1
    spec:
      containers:
        - name: nginx
          image: eclipse-temurin:17-jre-alpine
          ports:
            - containerPort: 80